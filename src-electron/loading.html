<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payroll</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: Segoe UI, system-ui, sans-serif; background: #FDF5F0; color: #3D2B1F; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    h1 { font-size: 1.5rem; margin: 0; font-weight: 800; }
    p { margin: 0; color: #6B5344; }
    .spin { width: 28px; height: 28px; border: 3px solid #E8D5CA; border-top-color: #C9927E; border-radius: 50%; animation: s .7s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <h1>Payroll</h1>
    <p>Starting…</p>
  </div>
</body>
</html>
